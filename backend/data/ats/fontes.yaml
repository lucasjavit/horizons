# Fontes de vagas do look4job.
# Novas fontes podem ser cadastradas aqui (ou pelo front, futuramente).
# ats: greenhouse | lever | ashby | workable | workday | maxun | firecrawl | custom  -> define qual coletor usar.
# workday:   empresas em *.myworkdayjobs.com — API JSON nao documentada porem estavel
#            (POST /wday/cxs/{tenant}/{site}/jobs); requer campos tenant e site.
# maxun:     site sem API — robo treinado na UI do Maxun (https://github.com/getmaxun/maxun);
#            requer campo robot_id. Deterministico; bom para fontes fixas de alto valor.
# firecrawl: site sem API — extracao por schema via Firecrawl self-hosted
#            (https://github.com/firecrawl/firecrawl); so precisa da URL. Bom para a watchlist.
# custom:    ainda sem coletor definido (candidato a virar maxun ou firecrawl).

search_profile:
  stack: ["Java", "Spring Boot"]
  seniority: ["Senior", "Pleno/Senior"]
  remote: ["Worldwide", "LATAM"]
  must_accept: "Brazil"
  scope: "somente vagas internacionais"

apis:
  - name: Remotive
    url: https://remotive.com/api/remote-jobs?category=software-dev
  - name: RemoteOK
    url: https://remoteok.com/api
  - name: Arbeitnow
    url: https://www.arbeitnow.com/api/job-board-api
  - name: WeWorkRemotely
    url: https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss
  - name: Himalayas
    url: https://himalayas.app/jobs/api

linkedin:
  # Coletor OPT-IN (app/collectors/linkedin.py). Usa o endpoint publico de busca que o
  # LinkedIn serve a visitantes DESLOGADOS — sem cookie de sessao, sem ler perfis.
  # Para ligar: LINKEDIN_ENABLED=1 no backend/.env. Riscos: endpoint nao documentado
  # (pode mudar ou passar a exigir login) e rate limit por IP. Paginacao curta (4 paginas)
  # e pausa de 4s entre paginas.
  enabled: false
  search_url: "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search?keywords=java%20spring%20boot&location=Worldwide&f_WT=2"

