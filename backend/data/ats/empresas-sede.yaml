# Onde a empresa TEM SEDE — não onde ela contrata.
#
# Serve a uma pergunta que nenhum outro dado responde: "esta é uma empresa do
# meu país oferecendo vaga para fora?". A Stefanini é brasileira e abre vaga
# para os EUA; o `contrataEm` do catálogo não distingue isso de uma americana
# contratando no Brasil.
#
# **Lista manual e parcial, de propósito.** Cobrir 919 empresas exigiria uma
# passada de IA sobre o catálogo; estas são as que aparecem no mercado
# brasileiro de tecnologia e resolvem o caso real. Empresa ausente daqui não
# é excluída de nada — só não responde a esse filtro.
#
# `nome` casa por substring, sem acento e sem caixa, contra o `company` da
# vaga. Por isso "ci&t" e "cit" aparecem como variantes: os ATS escrevem o
# mesmo nome de vários jeitos.

empresas:
  # --- Brasil: outsourcing e consultoria ---
  - nome: Stefanini
    sede: BR
    variantes: [stefanini, "stefanini latam", "stefanini group"]
  - nome: CI&T
    sede: BR
    variantes: ["ci&t", "ci and t", cit, "ciandt"]
  - nome: Encora
    sede: BR
