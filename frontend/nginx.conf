server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # A API e servida pelo mesmo host: o front chama /api e o nginx repassa
  # ao contêiner do backend. Assim nao ha CORS nem URL absoluta no bundle.
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;

    # A busca de vagas transmite resultado a resultado (SSE): sem
    # `proxy_buffering off` o nginx segura tudo no buffer e entrega de uma vez
    # no fim, o que anula o streaming — a pessoa esperaria o minuto inteiro
    # olhando tela parada.
    proxy_buffering off;
    proxy_cache off;
    # Conexao SSE fica aberta enquanto a busca roda. O default de 60s cortaria
    # uma busca mais longa no meio.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets com hash no nome sao imutaveis — cache longo e seguro.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Arquivo de dados nao entra no fallback do SPA. Sem isto, um .json que nao
  # existe na imagem responde 200 com o index.html — o dado nao vaza, mas o
  # 200 mente sobre o que existe, e "200 no quadro.json" e exatamente a
  # leitura errada que faria alguem achar que o backlog foi publicado.
  location ~ \.json$ {
    try_files $uri =404;
  }

  # O react-router usa rotas reais (/t/system-design/dns), entao qualquer
  # caminho desconhecido devolve o index.html em vez de 404.
  location / {
    try_files $uri $uri/ /index.html;
    # O HTML e o ponto de indireção para os assets versionados: cachea-lo
    # prenderia o usuario numa versao antiga do app.
    add_header Cache-Control "no-cache";
  }
}
