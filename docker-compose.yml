services:
  db:
    image: postgres:16-alpine
    container_name: horizons-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: horizons
      POSTGRES_PASSWORD: horizons
      POSTGRES_DB: horizons
    # 5433 no host: a 5432 ja e usada pelo Postgres do manage-house.
    ports:
      - '5433:5432'
    volumes:
      - horizons_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U horizons -d horizons']
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica as migrations e roda o seed, depois encerra. A api so sobe quando
  # este contêiner termina com sucesso. Usa o estagio de build da imagem do
  # backend, que e o unico que tem o CLI do Prisma e o ts-node.
  migrate:
    build:
      context: ./backend
      target: build
    container_name: horizons-migrate
    environment:
      DATABASE_URL: postgresql://horizons:horizons@db:5432/horizons?schema=public
    command: >
      sh -c "npx prisma migrate deploy &&
             npx ts-node --compiler-options '{\"module\":\"CommonJS\"}' prisma/seed.ts"
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./backend
    container_name: horizons-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://horizons:horizons@db:5432/horizons?schema=public
      PORT: 3333
      # O front chama /api no mesmo host (nginx faz o proxy), entao nao ha
      # requisicao cross-origin. A origem do dev server fica liberada para
      # quem quiser rodar `npm run dev` contra este backend.
      CORS_ORIGIN: http://localhost:5173
      # Cifra os tokens de API guardados. Em producao isto sai daqui e vai
      # para um segredo de verdade — commitar chave no compose so vale
      # enquanto o app roda na rede local.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-horizons dev key trocar antes de publicar}
      # A API do freehire (JOB-38). Vazia usa https://freehire.me.
      #
      # Existe porque o freehire e open source (MIT) e self-hostavel: no dia em
      # que depender do servico publico incomodar, sobe-se uma instancia e
      # aponta-se aqui, sem mexer em codigo. Serve tambem para apontar para um
      # duble em teste.
      FREEHIRE_API_URL: ${FREEHIRE_API_URL:-}
      # Provedores de IA: chave e URL base.
      #
      # A CHAVE normalmente vem do banco, cifrada, cadastrada em Configuracoes
      # (PLT-01) — estas variaveis sao a alternativa por ambiente, que e como o
      # deploy injeta segredo sem passar pela tela. Vazias por padrao.
      #
      # A URL BASE existe para apontar o provedor para um gateway, um proxy ou
      # um duble de teste, sem mexer em codigo. Foi o que permitiu verificar a
      # cadeia de queda sem nenhuma chave valida (25/08/2026).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_BASE_URL: ${CEREBRAS_BASE_URL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-}
      # Login com Google (PLT-02). O client id e publico — sai no HTML de
      # qualquer site que use Google Sign-In —, entao vem por variavel so
      # para nao amarrar o codigo a uma conta.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Assina a sessao. Validado no boot: menos de 16 caracteres derruba a
      # API com erro claro, em vez de aceitar token fraco em silencio.
      JWT_SECRET: ${JWT_SECRET:-horizons dev jwt secret trocar antes de publicar}
      # Quem entra como admin. Vazio = ninguem. Sem default hardcoded: se a
      # variavel sumir, o resultado seguro e ninguem ser admin, nunca alguem.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # LOGIN DESLIGADO (temporario, a pedido — 13/08/2026).
      #
      # Com 'true', NENHUMA rota exige token: o guard resolve todo mundo como
      # DEFAULT_USER_EMAIL. E o comportamento de antes do PLT-02, e tem o mesmo
      # risco — quem alcancar a porta 3333 le /api/settings/tokens, onde ficam
      # as chaves de IA. So vale enquanto isto roda em rede local.
      #
      # O default e 'false' de proposito, e nao 'true': esquecer a variavel
      # precisa FECHAR o acesso, nunca abrir. Quem quer o login desligado
      # localmente escreve AUTH_DISABLED=true no `.env`, que nao vai para o
      # git — assim a escolha e explicita e fica na maquina de quem a fez.
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # Servidor de e-mail do envio semanal (JOB-24). VAZIO e estado valido: o
      # provedor entao REGISTRA NO LOG em vez de enviar, e a tela mostra isso.
      SMTP_HOST: ${SMTP_HOST:-}
      # Base publica, para os links de um clique do e-mail (descadastrar e
      # "consegui a vaga"). Sem ela os links apontam para localhost:5173.
      APP_URL: ${APP_URL:-http://localhost:5173}
      # Telegram (JOB-32). VAZIO e estado valido: sem o token o canal fica
      # INERTE — a opcao nao aparece na aba Jobs, a rota do webhook nao fica
      # de pe, e a API avisa uma vez no boot.
      #
      # **Um bot por ambiente**: o Telegram entrega cada update a UMA url, e
      # com um bot so o desenvolvimento roubaria as mensagens da producao.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # O <bot> do deep link t.me/<bot>?start=<token>, sem o @.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      # O Telegram nao alcanca localhost:3333, entao aqui isto e a URL de um
      # tunel (ngrok, cloudflared). Vazia, o webhook nao e registrado e a API
      # diz por que.
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      # Opcional: vazio, e derivado do proprio token do bot.
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3333/api/auth/config',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Caminho relativo: o nginx da propria imagem repassa /api para a api.
        VITE_API_URL: /api
        # Em desenvolvimento a aba Quadro fica visivel — e para isso que ela
        # existe. O docker-compose.prod.yml passa vazio.
        VITE_QUADRO: 'true'
    container_name: horizons-web
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  horizons_pgdata:
